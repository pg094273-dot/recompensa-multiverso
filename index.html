<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Multiverso de Misiones · Enrique &amp; Eduardo</title>
  <meta name="description" content="Misiones diarias, retos y premios para Enrique y Eduardo.">
  <meta name="theme-color" content="#080a18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Multiverso">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true">
    <span class="aurora-1"></span>
    <span class="aurora-2"></span>
    <span class="aurora-3"></span>
  </div>
  <div class="stars" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <circle cx="32" cy="32" r="26" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-dasharray="70 20" stroke-linecap="round"/>
            <circle cx="32" cy="32" r="14" fill="url(#brandGrad)"/>
            <circle cx="42" cy="22" r="4" fill="#fff"/>
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffd166"/>
                <stop offset=".5" stop-color="#ff7a1a"/>
                <stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Multiverso de Misiones</h1>
          <p id="brandSub">Enrique &amp; Eduardo</p>
        </div>
      </div>
      <button class="icon-btn" data-action="openSettings" aria-label="Ajustes de la app" title="Ajustes">⚙️</button>
    </header>

    <nav class="kid-switch" id="kidSwitch" aria-label="Elegir jugador"></nav>

    <section class="hero" id="hero" aria-label="Progreso del jugador"></section>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Secciones"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
